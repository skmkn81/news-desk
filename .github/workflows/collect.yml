name: 뉴스 자동 수집

on:
  schedule:
    - cron: '0 22 * * *'   # 한국시간 아침 07:00
    - cron: '0 9 * * *'    # 한국시간 저녁 18:00
  workflow_dispatch:        # 손으로 즉시 실행하는 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      # news.json 은 내 컴퓨터 전용입니다. 실수로 올라와 있으면
      # 오래된 목록을 붙잡고 있게 되므로 지우고 시작합니다.
      - name: 내 컴퓨터 전용 파일 정리
        run: rm -f data/news.json

      - name: 뉴스 수집 실행
        shell: pwsh
        run: ./수집.ps1

      - name: 결과 올리기
        run: |
          git config user.name  "news-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.js data/status.json
          if git diff --staged --quiet; then
            echo "새로운 뉴스가 없어 그대로 둡니다."
          else
            git commit -m "뉴스 자동 수집 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
