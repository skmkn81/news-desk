<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16181d">
<title>MY NEWS DESK</title>
<style>
  :root{
    --bg:#faf9f7; --panel:#fff; --ink:#16181d; --muted:#71757e; --faint:#9aa0aa;
    --line:#e6e3dd; --line-soft:#f0ede7; --accent:#b4472b; --chip:#f2efe9;
    --ma:#7c5cbf; --kfood:#2f8f5b; --kpol:#c2513a; --kecon:#2d6ea8; --world:#8a6a2f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111317; --panel:#171a1f; --ink:#e8e6e2; --muted:#949aa4; --faint:#6f757f;
      --line:#282c33; --line-soft:#1f232a; --accent:#e8794f; --chip:#22262d;
      --ma:#a98ce0; --kfood:#5cc189; --kpol:#e8836c; --kecon:#6aa6de; --world:#c2a05c;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    line-height:1.5; -webkit-text-size-adjust:100%;
  }
  a{color:inherit}

  /* ---------- 상단 고정 영역 ---------- */
  .top{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .inner{max-width:820px; margin:0 auto; padding:0 16px}

  .brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding-block:18px 10px}
  .brand h1{margin:0; font-size:22px; font-weight:800; letter-spacing:.16em}
  .stamp{font-size:12px; color:var(--faint); margin-left:auto}

  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; border:1px solid var(--line); background:var(--chip); color:var(--muted);
    border-radius:999px; padding:7px 14px; font-size:13.5px; cursor:pointer;
    font-family:inherit; white-space:nowrap; display:flex; align-items:center; gap:6px;
  }
  .tab b{font-weight:700; color:var(--ink)}
  .tab .cnt{font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums}
  .tab[aria-selected="true"]{background:var(--ink); border-color:var(--ink)}
  .tab[aria-selected="true"] b,
  .tab[aria-selected="true"] .cnt{color:var(--bg)}

  .tools{display:flex; gap:8px; align-items:center; padding-bottom:12px}
  .search{
    flex:1 1 auto; min-width:0; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:8px; padding:8px 12px; font-size:14px; font-family:inherit;
  }
  .search::placeholder{color:var(--faint)}
  .toggle{
    flex:0 0 auto; border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  .toggle[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}

  /* ---------- 목록 ---------- */
  main{max-width:820px; margin:0 auto; padding:0 16px; padding-block:4px 64px}

  .daybar{
    display:flex; align-items:center; gap:10px;
    margin:22px 0 2px; font-size:12px; color:var(--faint); font-weight:600;
  }
  .daybar::after{content:""; flex:1; height:1px; background:var(--line)}
  .daybar:first-child{margin-top:10px}

  ul.feed{list-style:none; margin:0; padding:0}
  ul.feed li{border-bottom:1px solid var(--line-soft)}
  ul.feed a{
    display:block; padding:12px 2px; text-decoration:none; color:inherit;
  }
  ul.feed a:hover .t{color:var(--accent); text-decoration:underline}
  .t{font-size:15.5px; font-weight:500; word-break:keep-all}
  .meta{
    display:none; gap:8px; align-items:center; margin-top:5px;
    font-size:11.5px; color:var(--faint);
  }
  body.detail .meta{display:flex; flex-wrap:wrap}
  .meta .time{font-variant-numeric:tabular-nums}
  .meta .dot{opacity:.5}
  .lab{
    font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:4px;
    border:1px solid currentColor; opacity:.9;
  }
  .lab.ma{color:var(--ma)} .lab.kfood{color:var(--kfood)} .lab.kpol{color:var(--kpol)}
  .lab.kecon{color:var(--kecon)} .lab.world{color:var(--world)}
  .pv{
    display:none; margin-top:5px; font-size:13px; color:var(--muted);
    overflow:hidden; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  body.detail .pv.has{display:-webkit-box}

  .more{
    display:block; width:100%; margin-top:22px; border:1px solid var(--line);
    background:var(--panel); color:var(--muted); border-radius:10px;
    padding:13px; font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  .more:hover{border-color:var(--accent); color:var(--accent)}

  .empty{
    margin-top:40px; padding:26px 20px; border:1px dashed var(--line);
    border-radius:12px; text-align:center; color:var(--muted); font-size:14px;
  }
  .empty code{
    background:var(--chip); padding:2px 6px; border-radius:4px;
    font-size:13px; word-break:break-all;
  }
  .empty h2{margin:0 0 10px; font-size:16px; color:var(--ink)}

  @media (max-width:520px){
    .brand h1{font-size:18px; letter-spacing:.12em}
    .stamp{flex-basis:100%; margin-left:0; margin-top:2px}
    .t{font-size:15px}
  }
</style>
</head>
<body>

<div class="top">
  <div class="inner">
    <div class="brand">
      <h1>MY NEWS DESK</h1>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="제목·언론사로 검색" autocomplete="off">
      <button class="toggle" id="detail" aria-pressed="false">자세히</button>
    </div>
  </div>
</div>

<main>
  <div id="list"></div>
</main>

<script src="data/news.js" charset="utf-8"></script>
<script>
(function () {
  var D = window.NEWS_DATA;
  var listEl = document.getElementById('list');

  /* 데이터가 없을 때 안내 */
  if (!D || !D.articles || !D.articles.length) {
    listEl.innerHTML =
      '<div class="empty"><h2>아직 수집된 뉴스가 없습니다</h2>' +
      '폴더 안의 <code>수집.ps1</code> 파일에서 마우스 오른쪽 클릭 &rarr; ' +
      '<b>PowerShell에서 실행</b>을 누른 다음, 이 페이지를 새로고침(F5) 하세요.</div>';
    return;
  }

  var TABS = [{ id: 'all', label: '전체' }].concat(D.tabs || []);
  var PAGE = 60;
  var state = { tab: 'all', q: '', shown: PAGE };

  /* ---------- 도우미 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function tabsOf(a) { return (a.tabs && a.tabs.length) ? a.tabs : [a.tab]; }
  function labelOf(id) {
    for (var i = 0; i < TABS.length; i++) if (TABS[i].id === id) return TABS[i].label;
    return id;
  }
  function dayKey(d) {
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function dayLabel(d) {
    var now = new Date();
    if (dayKey(d) === dayKey(now)) return '오늘';
    var y = new Date(now.getTime() - 86400000);
    if (dayKey(d) === dayKey(y)) return '어제';
    return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  }

  /* ---------- 상단 정보 ---------- */
  (function () {
    var g = D.generatedAt ? new Date(D.generatedAt) : null;
    document.getElementById('stamp').textContent = g
      ? '마지막 수집 ' + g.toLocaleString('ko-KR', {
          month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) + ' · 총 ' + D.total + '건'
      : '총 ' + D.articles.length + '건';
  })();

  /* ---------- 탭 ---------- */
  var tabsEl = document.getElementById('tabs');
  TABS.forEach(function (t) {
    var n = t.id === 'all' ? D.articles.length : ((D.tabCounts && D.tabCounts[t.id]) || 0);
    var b = document.createElement('button');
    b.className = 'tab';
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', t.id === state.tab ? 'true' : 'false');
    b.dataset.id = t.id;
    b.innerHTML = '<b>' + esc(t.label) + '</b><span class="cnt">' + n + '</span>';
    b.onclick = function () {
      state.tab = t.id;
      state.shown = PAGE;
      Array.prototype.forEach.call(tabsEl.children, function (c) {
        c.setAttribute('aria-selected', c.dataset.id === t.id ? 'true' : 'false');
      });
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    tabsEl.appendChild(b);
  });

  /* ---------- 검색 · 자세히 ---------- */
  var qEl = document.getElementById('q');
  var timer = null;
  qEl.oninput = function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.q = qEl.value.trim().toLowerCase();
      state.shown = PAGE;
      render();
    }, 180);
  };

  var dEl = document.getElementById('detail');
  try {
    if (localStorage.getItem('newsdesk.detail') === '1') {
      document.body.classList.add('detail');
      dEl.setAttribute('aria-pressed', 'true');
    }
  } catch (e) {}
  dEl.onclick = function () {
    var on = document.body.classList.toggle('detail');
    dEl.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem('newsdesk.detail', on ? '1' : '0'); } catch (e) {}
  };

  /* ---------- 그리기 ---------- */
  function filtered() {
    return D.articles.filter(function (a) {
      if (state.tab !== 'all' && tabsOf(a).indexOf(state.tab) < 0) return false;
      if (state.q) {
        var hay = (a.title + ' ' + (a.source || '')).toLowerCase();
        if (hay.indexOf(state.q) < 0) return false;
      }
      return true;
    });
  }

  function render() {
    var rows = filtered();

    if (!rows.length) {
      listEl.innerHTML = '<div class="empty">조건에 맞는 기사가 없습니다.</div>';
      return;
    }

    var slice = rows.slice(0, state.shown);
    var html = '';
    var lastDay = '';
    var openUl = false;

    slice.forEach(function (a) {
      var d = new Date(a.date);
      var k = dayKey(d);
      if (k !== lastDay) {
        if (openUl) html += '</ul>';
        html += '<div class="daybar">' + esc(dayLabel(d)) + '</div><ul class="feed">';
        lastDay = k;
        openUl = true;
      }

      var time = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      var labs = tabsOf(a).map(function (id) {
        return '<span class="lab ' + esc(id) + '">' + esc(labelOf(id)) + '</span>';
      }).join('');

      html +=
        '<li><a href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer">' +
          '<div class="t">' + esc(a.title) + '</div>' +
          '<div class="pv' + (a.preview ? ' has' : '') + '">' + esc(a.preview) + '</div>' +
          '<div class="meta">' + labs +
            '<span class="time">' + time + '</span>' +
            (a.source ? '<span class="dot">·</span><span>' + esc(a.source) + '</span>' : '') +
          '</div>' +
        '</a></li>';
    });
    if (openUl) html += '</ul>';

    if (rows.length > state.shown) {
      html += '<button class="more" type="button" id="more">' +
              '더 보기 (' + (rows.length - state.shown) + '건 남음)</button>';
    }

    listEl.innerHTML = html;

    var m = document.getElementById('more');
    if (m) m.onclick = function () { state.shown += PAGE; render(); };
  }

  render();
})();
</script>
</body>
</html>
